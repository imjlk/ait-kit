name: Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  update-release-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-13
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate publishable tarballs
        run: bun run packages:build && bun run test:packages

      - name: Install Sampo
        run: cargo install sampo --locked --version 0.17.4

      - name: Require release token
        env:
          SAMPO_RELEASE_TOKEN: ${{ secrets.SAMPO_RELEASE_TOKEN }}
        run: test -n "$SAMPO_RELEASE_TOKEN"

      - name: Prepare release changes
        shell: bash
        run: |
          set +e
          bun run release
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "No release changes to prepare."
            exit 0
          fi

          exit "$status"

      - name: Create or update release PR
        id: release_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SAMPO_RELEASE_TOKEN }}
          branch: release/sampo
          base: main
          title: "release: version packages"
          commit-message: "release: version packages"
          body: |
            Automated release PR generated from the latest `main` changes.

            - updates package versions
            - updates package changelogs
            - consumes pending `.sampo/changesets/*`

            Merge this PR with **Squash and merge** to trigger npm OIDC publish from `main`.
          add-paths: |
            .sampo/**
            packages/**/package.json
            packages/**/CHANGELOG.md
            bun.lock

      - name: Add release label
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SAMPO_RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pull-request-number }}
        shell: bash
        run: |
          set +e

          for attempt in 1 2 3; do
            if gh pr edit "$PR_NUMBER" --add-label release; then
              exit 0
            fi

            echo "Attempt ${attempt} to add the release label failed; retrying..."
            sleep $((attempt * 5))
          done

          echo "::warning::Failed to add the release label to PR #${PR_NUMBER}; continuing."
